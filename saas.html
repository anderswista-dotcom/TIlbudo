function exportBackup(){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download='tilbudo-backup-'+nowS()+'.json';a.click();toast('Backup hentet')}
function importBackup(el){var f=el.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var d=JSON.parse(r.result);if(!d||!Array.isArray(d.docs)||!d.firma||!Array.isArray(d.ydel))throw 0;if(!confirm('Gendan backup? Dine nuværende data erstattes.'))return;d.plan=S.plan;S=d;flush();render();toast('Backup gendannet')}catch(e){toast('Ugyldig backupfil')}};r.readAsText(f)}
var UN=['stk','time','dag','m','m²','m³','kg','l','pakke'],YQ='',PO=0;
function unitOpts(e){return (UN.indexOf(e)<0?UN.concat([e]):UN).map(function(u){return '<option'+(u==e?' selected':'')+'>'+esc(u)+'</option>'}).join('')}
function addY(){S.ydel.push({n:'Ny ydelse',e:'stk',p:0});YQ='';sv();render();toast('Ydelse tilføjet')}
function delY(i){S.ydel.splice(i,1);sv();render()}
function renPak(i){var n=prompt('Nyt navn:',S.pakker[i].n);if(n){S.pakker[i].n=n;sv();render()}}
function newPak(){if(!can('pakker')){up('pakker');return}var n=$('pkn').value.trim(),l=[];S.ydel.forEach(function(y,i){if($('pc'+i).checked)l.push({t:y.n,a:+$('pq'+i).value||1,e:y.e,p:y.p})});if(!n||!l.length){toast('Giv pakken et navn, og vælg mindst én ydelse');return}S.pakker.push({n:n,l:l});PO=0;sv();render();toast('Pakke oprettet')}
function vYdel(){
 var avg=S.ydel.length?S.ydel.reduce(function(n,y){return n+y.p},0)/S.ydel.length:0,rows=S.ydel.map(function(y,i){return [y,i]}).filter(function(r){return !YQ||r[0].n.toLowerCase().indexOf(YQ)>-1});
 var h='<div class="kp"><div class="card k"><div class="l">Ydelser</div><div class="v">'+S.ydel.length+'</div><div class="s">i din prisliste</div></div><div class="card k"><div class="l">Pakker</div><div class="v">'+S.pakker.length+'</div><div class="s">gemte sæt af linjer</div></div><div class="card k"><div class="l">Gns. pris</div><div class="v">'+kr(avg)+'</div><div class="s">ekskl. moms</div></div></div>';
 h+='<div class="card"><h4>Hurtig start</h4><p class="mut">Indlæs eksempelydelser for din branche, og ret priserne til dine egne.</p><div class="tiles">'+Object.keys(PRE).map(function(k){return '<button class="tile" onclick="loadPre(\''+k+'\')"><b>'+k+'</b><span class="mut">'+PRE[k].length+' ydelser</span></button>'}).join('')+'</div></div>';
 h+='<div class="tb"><div class="sw">'+ic('search')+'<input id="yq" placeholder="Søg i prislisten" value="'+esc(YQ)+'" oninput="YQ=this.value.toLowerCase();render();var e=$(\'yq\');e.focus();e.setSelectionRange(99,99)"></div><button class="p" style="margin-left:auto" onclick="addY()">'+ic('plus')+'Tilføj ydelse</button></div>';
 h+='<div class="tw"><table class="tbl"><thead><tr><th>Ydelse</th><th>Enhed</th><th class="r">Pris ekskl. moms</th><th class="r">Pris inkl. moms</th><th></th></tr></thead><tbody>'+(rows.length?rows.map(function(r){var y=r[0],i=r[1];return '<tr><td><input value="'+esc(y.n)+'" oninput="S.ydel['+i+'].n=this.value;sv()"></td><td><select style="width:96px" onchange="S.ydel['+i+'].e=this.value;sv()">'+unitOpts(y.e)+'</select></td><td class="r"><div class="pi"><input type="number" step="any" value="'+y.p+'" oninput="S.ydel['+i+'].p=+this.value;$(\'ink'+i+'\').textContent=kr(S.ydel['+i+'].p*1.25);sv()"><span class="mut">kr.</span></div></td><td class="r mut" id="ink'+i+'">'+kr(y.p*1.25)+'</td><td class="r act"><button class="ib d" title="Slet" onclick="delY('+i+')">'+ic('trash')+'</button></td></tr>'}).join(''):'<tr><td colspan="5" class="mut" style="text-align:center;padding:30px">'+(S.ydel.length?'Ingen ydelser matcher søgningen':'Din prisliste er tom. Vælg en branche ovenfor, eller tilføj en ydelse.')+'</td></tr>')+'</tbody></table></div>';
 h+='<div class="row" style="margin:24px 0 12px"><div><h4 style="margin:0;font-size:19px">Pakker</h4><div class="mut" style="font-size:13px">Gemte sæt af linjer, du kan tilføje til et tilbud med ét klik'+(can('pakker')?'':' (kræver Pro)')+'.</div></div><button class="p" onclick="if(can(\'pakker\')){PO=1;render()}else up(\'pakker\')">'+ic('plus')+'Ny pakke</button></div>';
 h+='<div class="tw"><table class="tbl"><thead><tr><th>Pakke</th><th>Indhold</th><th class="r">Samlet pris</th><th></th></tr></thead><tbody>'+(S.pakker.length?S.pakker.map(function(k,i){var t=k.l.reduce(function(n,x){return n+x.a*x.p},0);return '<tr><td><b>'+esc(k.n)+'</b></td><td class="mut"><div class="tr">'+k.l.map(function(x){return esc(x.t)}).join(', ')+'</div></td><td class="r"><b>'+kr(t)+'</b><div class="mut">ekskl. moms</div></td><td class="r act"><button class="ib" title="Omdøb" onclick="renPak('+i+')">'+ic('edit')+'</button><button class="ib d" title="Slet" onclick="S.pakker.splice('+i+',1);sv();render()">'+ic('trash')+'</button></td></tr>'}).join(''):'<tr><td colspan="4" class="mut" style="text-align:center;padding:30px">Ingen pakker endnu. Opret en her, eller gem linjerne fra et tilbud som pakke.</td></tr>')+'</tbody></table></div>';
 if(PO)h+='<div id="dr"><div class="ov" onclick="PO=0;render()"></div><div class="pn"><div class="row" style="margin-bottom:18px"><h3 style="margin:0;font-size:21px;letter-spacing:-.5px">Ny pakke</h3><button class="ib" title="Luk" onclick="PO=0;render()">'+ic('x')+'</button></div><div class="fld"><label>Navn på pakken</label><input id="pkn" placeholder="Fx Badeværelse – standard"></div><label>Vælg ydelser og antal</label>'+(S.ydel.length?S.ydel.map(function(y,i){return '<div class="li"><label class="tdl"><input type="checkbox" id="pc'+i+'" style="width:auto"> '+esc(y.n)+'</label><input id="pq'+i+'" type="number" step="any" value="1" style="width:76px" title="Antal"></div>'}).join(''):'<p class="mut">Tilføj først nogle ydelser i prislisten.</p>')+'<div class="row" style="margin-top:22px"><button onclick="PO=0;render()">Annullér</button><button class="p" onclick="newPak()">'+ic('plus')+'Opret pakke</button></div></div></div>';
 return h}
boot();
</script>
</body>
</html>
